<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Real Online Dictionary</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>Online Dictionary</h1>

    <div class="search-box">
        <input type="text" id="word" placeholder="Enter a word">

        <button onclick="searchWord()">
            Search
        </button>
    </div>

    <div id="result">
        <p>Enter a word to search for its meaning.</p>
    </div>

</div>

<script>

    const dictionary = new Map();

    async function searchWord() {

        const word = document
            .getElementById("word")
            .value
            .trim()
            .toLowerCase();

        const result = document.getElementById("result");

        if (word === "") {
            result.innerHTML = "<p>Please enter a word.</p>";
            return;
        }

        if (dictionary.has(word)) {

            result.innerHTML =
                "<h2>" + word + "</h2>" +
                "<p>" + dictionary.get(word) + "</p>" +
                "<small>Retrieved from cache</small>";

            return;
        }

        result.innerHTML = "<p>Searching...</p>";

        try {

            const response = await fetch(
                "https://api.dictionaryapi.dev/api/v2/entries/en/" + word
            );

            if (!response.ok) {
                throw new Error("Word not found");
            }

            const data = await response.json();

            const meaning =
                data[0].meanings[0].definitions[0].definition;

            dictionary.set(word, meaning);

            result.innerHTML =
                "<h2>" + word + "</h2>" +
                "<p>" + meaning + "</p>" +
                "<small>Retrieved from online dictionary</small>";

        } catch (error) {

            result.innerHTML =
                "<p>Word not found. Please try another word.</p>";
        }
    }

    document.getElementById("word").addEventListener("keypress", function(event) {

        if (event.key === "Enter") {
            searchWord();
        }

    });

</script>

</body>
</html>
